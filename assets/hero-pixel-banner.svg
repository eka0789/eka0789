<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Eka Prasetyo — Fullstack Developer, AI Builder, Tech Educator">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#1a1b27"/>
      <stop offset="100%" stop-color="#241e4e"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70a5fd"/>
      <stop offset="50%" stop-color="#bf91f3"/>
      <stop offset="100%" stop-color="#38bdae"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="4" y="4" width="892" height="252" rx="12"/>
    </clipPath>
  </defs>

  <style>
    .twinkle1 { animation: twinkle 2.4s steps(2) infinite; }
    .twinkle2 { animation: twinkle 3.1s steps(2) 0.8s infinite; }
    .twinkle3 { animation: twinkle 2.0s steps(2) 1.4s infinite; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .float { animation: floatY 2.6s steps(4) infinite; }
    .steam1 { animation: steamUp 2.2s steps(6) infinite; }
    .steam2 { animation: steamUp 2.2s steps(6) 1.1s infinite; }
    .code1 { animation: codePulse 2.4s steps(2) infinite; }
    .code2 { animation: codePulse 2.4s steps(2) 0.6s infinite; }
    .code3 { animation: codePulse 2.4s steps(2) 1.2s infinite; }
    .pulseDot { animation: pulse 1.8s steps(2) infinite; }
    .shoot { animation: shootStar 5.5s linear infinite; }
    .scan { animation: scanMove 6s linear infinite; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 1; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes steamUp {
      0% { transform: translateY(0px); opacity: 0.9; }
      100% { transform: translateY(-14px); opacity: 0; }
    }
    @keyframes codePulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes shootStar {
      0% { transform: translate(0px, 0px); opacity: 0; }
      5% { opacity: 1; }
      20% { transform: translate(-180px, 75px); opacity: 0; }
      100% { transform: translate(-180px, 75px); opacity: 0; }
    }
    @keyframes scanMove {
      0% { transform: translateY(-10px); }
      100% { transform: translateY(270px); }
    }
  </style>

  <!-- Outer Neon Pixel Frame -->
  <rect x="2" y="2" width="896" height="256" rx="14" fill="url(#borderGrad)"/>

  <g clip-path="url(#cardClip)">
    <!-- Background -->
    <rect x="4" y="4" width="892" height="252" fill="url(#skyGrad)"/>

    <!-- Subtle Pixel Grid Background -->
    <g opacity="0.06" shape-rendering="crispEdges">
      <path d="M0 32 H900 M0 64 H900 M0 96 H900 M0 128 H900 M0 160 H900 M0 192 H900 M0 224 H900" stroke="#70a5fd" stroke-width="1"/>
      <path d="M60 0 V260 M120 0 V260 M180 0 V260 M240 0 V260 M300 0 V260 M360 0 V260 M420 0 V260 M480 0 V260 M540 0 V260 M600 0 V260 M660 0 V260 M720 0 V260 M780 0 V260 M840 0 V260" stroke="#70a5fd" stroke-width="1"/>
    </g>

    <!-- Animated Scanline -->
    <rect class="scan" x="4" y="0" width="892" height="4" fill="#70a5fd" opacity="0.07"/>

    <!-- Twinkling Pixel Stars -->
    <g shape-rendering="crispEdges">
      <rect class="twinkle1" x="62" y="28" width="4" height="4" fill="#ffffff"/>
      <rect class="twinkle2" x="148" y="42" width="4" height="4" fill="#70a5fd"/>
      <rect class="twinkle3" x="256" y="24" width="6" height="6" fill="#bf91f3"/>
      <rect class="twinkle1" x="380" y="34" width="4" height="4" fill="#38bdae"/>
      <rect class="twinkle2" x="492" y="22" width="4" height="4" fill="#ffffff"/>
      <rect class="twinkle3" x="574" y="44" width="4" height="4" fill="#e0af68"/>
      <rect class="twinkle1" x="652" y="26" width="6" height="6" fill="#70a5fd"/>
      <rect class="twinkle2" x="838" y="34" width="4" height="4" fill="#ffffff"/>
      <rect class="twinkle3" x="790" y="20" width="4" height="4" fill="#bf91f3"/>
      <!-- Plus-shaped pixel star -->
      <g class="twinkle2" fill="#e0af68">
        <rect x="526" y="54" width="4" height="12"/>
        <rect x="522" y="58" width="12" height="4"/>
      </g>
    </g>

    <!-- Shooting Pixel Star -->
    <g class="shoot" shape-rendering="crispEdges">
      <rect x="740" y="24" width="6" height="6" fill="#ffffff"/>
      <rect x="746" y="22" width="8" height="4" fill="#70a5fd" opacity="0.8"/>
      <rect x="754" y="20" width="10" height="2" fill="#bf91f3" opacity="0.5"/>
    </g>

    <!-- Pixel City Skyline Silhouette -->
    <g shape-rendering="crispEdges" fill="#131626">
      <rect x="4" y="216" width="52" height="40"/>
      <rect x="56" y="198" width="38" height="58"/>
      <rect x="94" y="220" width="64" height="36"/>
      <rect x="158" y="204" width="44" height="52"/>
      <rect x="202" y="224" width="76" height="32"/>
      <rect x="278" y="196" width="48" height="60"/>
      <rect x="326" y="214" width="60" height="42"/>
      <rect x="386" y="202" width="42" height="54"/>
      <rect x="428" y="222" width="88" height="34"/>
      <rect x="516" y="208" width="56" height="48"/>
      <rect x="572" y="220" width="324" height="36"/>
    </g>
    <!-- Glowing Pixel Windows -->
    <g shape-rendering="crispEdges">
      <rect class="twinkle2" x="66" y="208" width="6" height="6" fill="#e0af68" opacity="0.8"/>
      <rect x="78" y="208" width="6" height="6" fill="#70a5fd" opacity="0.5"/>
      <rect class="twinkle1" x="168" y="214" width="6" height="6" fill="#38bdae" opacity="0.8"/>
      <rect x="288" y="206" width="6" height="6" fill="#bf91f3" opacity="0.7"/>
      <rect class="twinkle3" x="302" y="218" width="6" height="6" fill="#e0af68" opacity="0.8"/>
      <rect x="396" y="212" width="6" height="6" fill="#70a5fd" opacity="0.7"/>
      <rect class="twinkle1" x="528" y="218" width="6" height="6" fill="#38bdae" opacity="0.7"/>
    </g>

    <!-- Bottom Neon Pixel Floor Line -->
    <rect x="4" y="248" width="892" height="8" fill="#161b22" shape-rendering="crispEdges"/>
    <rect x="4" y="248" width="892" height="2" fill="url(#borderGrad)" shape-rendering="crispEdges"/>

    <!-- LEFT SECTION: Pixel HUD & Title -->
    <!-- Online Status Badge -->
    <g shape-rendering="crispEdges">
      <rect x="46" y="38" width="228" height="24" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <rect class="pulseDot" x="58" y="46" width="8" height="8" fill="#38bdae"/>
      <text x="74" y="55" font-family="'Courier New', Consolas, monospace" font-size="12" font-weight="bold" fill="#38bdae" letter-spacing="1.5">ONLINE // INDONESIA</text>
    </g>

    <!-- Main Name with Pixel Drop Shadow -->
    <text x="48" y="114" font-family="'Courier New', Consolas, monospace" font-size="44" font-weight="900" fill="#0b0e14" letter-spacing="2">EKA PRASETYO</text>
    <text x="45" y="111" font-family="'Courier New', Consolas, monospace" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="2">EKA PRASETYO</text>
    <!-- Blinking Pixel Cursor -->
    <rect class="cursor" x="392" y="79" width="14" height="34" fill="#70a5fd" shape-rendering="crispEdges"/>

    <!-- Role Subtitle -->
    <text x="46" y="144" font-family="'Courier New', Consolas, monospace" font-size="15" font-weight="bold" fill="#70a5fd" letter-spacing="1.2">&gt; FULLSTACK DEV  |  AI BUILDER  |  TECH EDUCATOR</text>

    <!-- Pixel Tech Pills -->
    <g shape-rendering="crispEdges" font-family="'Courier New', Consolas, monospace" font-size="11" font-weight="bold">
      <rect x="46" y="164" width="96" height="24" fill="#1f2937" stroke="#70a5fd" stroke-width="2"/>
      <text x="94" y="180" text-anchor="middle" fill="#a9b1d6">AI / VISION</text>

      <rect x="152" y="164" width="112" height="24" fill="#1f2937" stroke="#bf91f3" stroke-width="2"/>
      <text x="208" y="180" text-anchor="middle" fill="#a9b1d6">WEB &amp; MOBILE</text>

      <rect x="274" y="164" width="118" height="24" fill="#1f2937" stroke="#38bdae" stroke-width="2"/>
      <text x="333" y="180" text-anchor="middle" fill="#a9b1d6">DEVOPS / PAAS</text>

      <rect x="402" y="164" width="106" height="24" fill="#1f2937" stroke="#e0af68" stroke-width="2"/>
      <text x="455" y="180" text-anchor="middle" fill="#a9b1d6">MENTORSHIP</text>
    </g>

    <!-- RIGHT SECTION: Animated Pixel Dev Workstation -->
    <g transform="translate(600, 48)" shape-rendering="crispEdges">
      <!-- Floating Pixel Robot Mascot -->
      <g class="float" transform="translate(178, -6)">
        <!-- Antenna -->
        <rect x="14" y="0" width="4" height="6" fill="#38bdae"/>
        <rect x="12" y="-4" width="8" height="4" fill="#70a5fd"/>
        <!-- Head -->
        <rect x="4" y="6" width="24" height="18" fill="#bf91f3"/>
        <rect x="8" y="10" width="16" height="10" fill="#0d1117"/>
        <!-- Glowing Eyes -->
        <rect x="10" y="13" width="4" height="4" fill="#38bdae"/>
        <rect x="18" y="13" width="4" height="4" fill="#38bdae"/>
        <!-- Body -->
        <rect x="8" y="24" width="16" height="10" fill="#70a5fd"/>
        <rect x="12" y="27" width="8" height="4" fill="#e0af68"/>
      </g>

      <!-- Monitor Stand & Base -->
      <rect x="88" y="128" width="24" height="18" fill="#414868"/>
      <rect x="66" y="144" width="68" height="8" fill="#565f89"/>

      <!-- Ultrawide Pixel Monitor -->
      <rect x="20" y="28" width="160" height="102" fill="#414868"/>
      <rect x="26" y="34" width="148" height="90" fill="url(#screenGlow)"/>

      <!-- Window Header Bar -->
      <rect x="26" y="34" width="148" height="12" fill="#1a1b27"/>
      <rect x="32" y="38" width="4" height="4" fill="#f7768e"/>
      <rect x="40" y="38" width="4" height="4" fill="#e0af68"/>
      <rect x="48" y="38" width="4" height="4" fill="#38bdae"/>

      <!-- Animated Pixel Code Lines -->
      <g class="code1">
        <rect x="34" y="54" width="28" height="5" fill="#bf91f3"/>
        <rect x="68" y="54" width="44" height="5" fill="#70a5fd"/>
        <rect x="118" y="54" width="18" height="5" fill="#38bdae"/>
      </g>
      <g class="code2">
        <rect x="44" y="66" width="22" height="5" fill="#e0af68"/>
        <rect x="72" y="66" width="62" height="5" fill="#a9b1d6"/>
      </g>
      <g class="code3">
        <rect x="44" y="78" width="38" height="5" fill="#38bdae"/>
        <rect x="88" y="78" width="52" height="5" fill="#70a5fd"/>
      </g>
      <g class="code1">
        <rect x="44" y="90" width="50" height="5" fill="#f7768e"/>
        <rect x="100" y="90" width="34" height="5" fill="#bf91f3"/>
      </g>
      <g class="code2">
        <rect x="34" y="102" width="24" height="5" fill="#bf91f3"/>
        <rect x="64" y="102" width="28" height="5" fill="#e0af68"/>
        <rect class="cursor" x="98" y="102" width="6" height="5" fill="#38bdae"/>
      </g>

      <!-- Pixel Desk -->
      <rect x="-10" y="152" width="256" height="10" fill="#292e42"/>
      <rect x="-10" y="152" width="256" height="2" fill="#70a5fd" opacity="0.6"/>

      <!-- Pixel Keyboard -->
      <rect x="52" y="146" width="96" height="6" fill="#24283b"/>
      <rect x="56" y="148" width="12" height="2" fill="#70a5fd"/>
      <rect x="72" y="148" width="12" height="2" fill="#bf91f3"/>
      <rect x="88" y="148" width="24" height="2" fill="#38bdae"/>
      <rect x="116" y="148" width="12" height="2" fill="#e0af68"/>
      <rect x="132" y="148" width="12" height="2" fill="#f7768e"/>

      <!-- Steaming Pixel Coffee Mug -->
      <g transform="translate(196, 128)">
        <rect class="steam1" x="6" y="-8" width="4" height="6" fill="#a9b1d6"/>
        <rect class="steam2" x="14" y="-10" width="4" height="6" fill="#a9b1d6"/>
        <rect x="0" y="2" width="22" height="22" fill="#e0af68"/>
        <rect x="4" y="6" width="14" height="14" fill="#c0843d"/>
        <rect x="22" y="6" width="6" height="4" fill="#e0af68"/>
        <rect x="26" y="10" width="4" height="6" fill="#e0af68"/>
        <rect x="22" y="16" width="6" height="4" fill="#e0af68"/>
      </g>

      <!-- Mini Pixel Plant -->
      <g transform="translate(-2, 124)">
        <rect x="6" y="0" width="4" height="12" fill="#38bdae"/>
        <rect x="2" y="4" width="4" height="8" fill="#2ac3de"/>
        <rect x="10" y="4" width="4" height="8" fill="#73daca"/>
        <rect x="0" y="12" width="16" height="16" fill="#f7768e"/>
        <rect x="2" y="14" width="12" height="4" fill="#ff9e64"/>
      </g>
    </g>
  </g>
</svg>
